<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" fill="none">
  <rect width="600" height="360" fill="#03060a"/>
  <!-- Night Road Headlight Cones -->
  <polygon points="100,280 600,120 600,360" fill="#ffc53d" opacity="0.15"/>
  <polygon points="100,280 600,200 600,360" fill="#ffffff" opacity="0.1"/>
  <!-- Breath-analyser Checkpoint Silhouette -->
  <rect x="220" y="160" width="160" height="120" rx="6" fill="#0b1729" stroke="#ff6b1a" stroke-width="2"/>
  <text x="300" y="210" font-family="'Anton', sans-serif" font-size="28" fill="#f4f7fb" text-anchor="middle">0.00 %</text>
  <text x="300" y="240" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">SOBER DRIVER CERTIFIED</text>
  <!-- Police Beacon Blue/Red Flares -->
  <circle cx="240" cy="140" r="14" fill="#38bdf8" opacity="0.8"/>
  <circle cx="360" cy="140" r="14" fill="#ef4444" opacity="0.8"/>
</svg>