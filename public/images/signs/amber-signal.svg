<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" fill="none">
  <!-- Traffic Light Enclosure -->
  <rect x="28" y="10" width="44" height="100" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <!-- Visors -->
  <path d="M36 22C42 16 58 16 64 22" stroke="#475569" stroke-width="2.5" fill="none"/>
  <path d="M36 52C42 46 58 46 64 52" stroke="#475569" stroke-width="2.5" fill="none"/>
  <path d="M36 82C42 76 58 76 64 82" stroke="#475569" stroke-width="2.5" fill="none"/>
  <!-- Red light (Off) -->
  <circle cx="50" cy="30" r="11" fill="#450a0a" stroke="#7f1d1d" stroke-width="1"/>
  <!-- Amber light (Glow / ON) -->
  <circle cx="50" cy="60" r="14" fill="#ffc53d" opacity="0.3"/>
  <circle cx="50" cy="60" r="11" fill="#ffc53d" stroke="#fef08a" stroke-width="2"/>
  <circle cx="48" cy="58" r="3" fill="#ffffff" opacity="0.8"/>
  <!-- Green light (Off) -->
  <circle cx="50" cy="90" r="11" fill="#052e16" stroke="#14532d" stroke-width="1"/>
</svg>