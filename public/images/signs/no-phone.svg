<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- No Mobile Phone Prohibition Sign -->
  <circle cx="50" cy="50" r="44" fill="#ffffff" stroke="#dc2626" stroke-width="8"/>
  <!-- Phone Body -->
  <rect x="38" y="28" width="24" height="44" rx="4" fill="#1e293b"/>
  <rect x="41" y="34" width="18" height="30" rx="1" fill="#94a3b8"/>
  <circle cx="50" cy="67" r="2" fill="#ffffff"/>
  <!-- Red Diagonal Slash -->
  <line x1="20" y1="20" x2="80" y2="80" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
</svg>