<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Blind Spot Diagram -->
  <rect x="6" y="6" width="88" height="88" rx="8" fill="#0b1729" stroke="#1d3455" stroke-width="2"/>
  <!-- Car in center -->
  <rect x="42" y="30" width="16" height="34" rx="4" fill="#38bdf8"/>
  <rect x="45" y="38" width="10" height="8" rx="1" fill="#070f1d"/>
  <!-- Driver Head checking shoulder -->
  <circle cx="48" cy="42" r="2.5" fill="#ffd66b"/>
  <!-- Blind spot cones (Orange hazard zones) -->
  <polygon points="40,40 16,56 16,74 40,58" fill="#ff6b1a" opacity="0.6"/>
  <polygon points="60,40 84,56 84,74 60,58" fill="#ff6b1a" opacity="0.6"/>
  <text x="50" y="86" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#ff8f4d" text-anchor="middle">BLIND SPOTS</text>
</svg>