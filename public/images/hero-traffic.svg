<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="600" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050a13"/>
      <stop offset="60%" stop-color="#0b1729"/>
      <stop offset="100%" stop-color="#14263f"/>
    </linearGradient>
    <linearGradient id="roadSurf" x1="600" y1="360" x2="600" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070f1d"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
    <linearGradient id="beaconBeam" x1="900" y1="200" x2="700" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff6b1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanBeam" x1="200" y1="180" x2="500" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky & Ambient Backdrop -->
  <rect width="1200" height="675" fill="url(#skyGrad)"/>

  <!-- Geometric Cityscape Silhouettes -->
  <polygon points="40,360 40,240 90,240 90,210 130,210 130,360" fill="#0c182b" opacity="0.6"/>
  <polygon points="140,360 140,180 180,180 180,160 210,160 210,360" fill="#0f1f36" opacity="0.7"/>
  <polygon points="230,360 230,220 280,220 280,360" fill="#0d1b30" opacity="0.5"/>
  <polygon points="880,360 880,170 940,170 940,150 970,150 970,360" fill="#0f1f36" opacity="0.7"/>
  <polygon points="990,360 990,200 1050,200 1050,360" fill="#0c182b" opacity="0.6"/>
  <polygon points="1070,360 1070,250 1140,250 1140,360" fill="#091322" opacity="0.5"/>

  <!-- Atmosphere Glow beams -->
  <polygon points="950,180 1200,675 750,675" fill="url(#beaconBeam)"/>
  <polygon points="200,160 50,675 600,675" fill="url(#cyanBeam)"/>

  <!-- Road Plane in Deep Perspective -->
  <polygon points="0,675 1200,675 820,360 380,360" fill="url(#roadSurf)"/>
  <line x1="380" y1="360" x2="820" y2="360" stroke="#ffc53d" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Curbs & Sidewalks with Chevron Hazard Striping -->
  <polygon points="0,675 380,360 330,360 0,580" fill="#14263f" opacity="0.5"/>
  <polygon points="1200,675 820,360 870,360 1200,580" fill="#14263f" opacity="0.5"/>

  <!-- Perspective Zebra Crosswalk Stripes -->
  <polygon points="430,380 470,380 440,430 390,430" fill="#f4f7fb" opacity="0.85"/>
  <polygon points="490,380 530,380 520,430 470,430" fill="#f4f7fb" opacity="0.85"/>
  <polygon points="550,380 590,380 600,430 550,430" fill="#f4f7fb" opacity="0.85"/>
  <polygon points="610,380 650,380 680,430 630,430" fill="#f4f7fb" opacity="0.85"/>
  <polygon points="670,380 710,380 760,430 710,430" fill="#f4f7fb" opacity="0.85"/>
  <polygon points="730,380 770,380 840,430 790,430" fill="#f4f7fb" opacity="0.85"/>

  <!-- Foreground Bold Zebra Stripes -->
  <polygon points="350,470 420,470 380,550 280,550" fill="#f4f7fb" opacity="0.9"/>
  <polygon points="450,470 520,470 510,550 420,550" fill="#f4f7fb" opacity="0.9"/>
  <polygon points="550,470 620,470 640,550 550,550" fill="#f4f7fb" opacity="0.9"/>
  <polygon points="650,470 720,470 770,550 680,550" fill="#f4f7fb" opacity="0.9"/>
  <polygon points="750,470 820,470 900,550 810,550" fill="#f4f7fb" opacity="0.9"/>

  <!-- Road Center Dashed Line -->
  <polygon points="595,570 605,570 608,675 592,675" fill="#ffc53d"/>

  <!-- Traffic Signal Gantry Left -->
  <line x1="260" y1="360" x2="260" y2="160" stroke="#334155" stroke-width="6"/>
  <line x1="260" y1="170" x2="360" y2="170" stroke="#334155" stroke-width="4"/>
  <rect x="330" y="150" width="22" height="52" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="341" cy="162" r="5" fill="#ef4444" opacity="0.9"/>
  <circle cx="341" cy="176" r="5" fill="#ffc53d" opacity="0.3"/>
  <circle cx="341" cy="190" r="5" fill="#10b981" opacity="0.3"/>

  <!-- Traffic Marshall / Crossing Guard Silhouette with Stop Paddle -->
  <g transform="translate(680, 290)">
    <!-- Safety High-Vis Vest -->
    <path d="M40 70L25 95H55L40 70Z" fill="#ff6b1a" opacity="0.9"/>
    <!-- Body -->
    <circle cx="40" cy="55" r="9" fill="#f4f7fb"/>
    <!-- Raised Arm holding Stop Sign -->
    <line x1="33" y1="75" x2="10" y2="60" stroke="#f4f7fb" stroke-width="4" stroke-linecap="round"/>
    <!-- Octagon Stop Paddle -->
    <polygon points="10,48 18,48 24,54 24,62 18,68 10,68 4,62 4,54" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="14" y="60" font-family="'Anton', sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">STOP</text>
  </g>

  <!-- Students Walking on Crosswalk -->
  <g transform="translate(480, 390)">
    <!-- Student 1 with backpack -->
    <circle cx="20" cy="20" r="7" fill="#f4f7fb"/>
    <path d="M20 28V62L12 80M20 45L28 80" stroke="#f4f7fb" stroke-width="4" stroke-linecap="round"/>
    <rect x="9" y="30" width="8" height="18" rx="3" fill="#ff6b1a"/>
    <!-- Student 2 -->
    <circle cx="45" cy="22" r="6.5" fill="#ffd66b"/>
    <path d="M45 30V62L38 80M45 45L53 80" stroke="#ffd66b" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="47" y="32" width="7" height="16" rx="2.5" fill="#38bdf8"/>
  </g>

  <!-- Modern Grid and Speed Marker Graphic -->
  <g transform="translate(860, 480)">
    <circle cx="40" cy="40" r="36" fill="#070f1d" stroke="#ff6b1a" stroke-width="4"/>
    <text x="40" y="47" font-family="'Anton', sans-serif" font-size="28" fill="#f4f7fb" text-anchor="middle">30</text>
    <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ffc53d" text-anchor="middle">ZONE</text>
  </g>

  <!-- Decorative Vignette Overlay -->
  <rect width="1200" height="675" fill="none" stroke="#ff6b1a" stroke-width="1" stroke-opacity="0.1"/>
</svg>