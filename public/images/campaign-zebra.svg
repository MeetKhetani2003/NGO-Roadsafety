<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" fill="none">
  <rect width="600" height="360" fill="#070f1d"/>
  <!-- Road Surface -->
  <polygon points="0,360 600,360 450,140 150,140" fill="#0b1729"/>
  <!-- Zebra Stripes being painted -->
  <polygon points="180,160 210,160 180,240 140,240" fill="#10b981" opacity="0.9"/>
  <polygon points="240,160 270,160 250,240 210,240" fill="#f4f7fb" opacity="0.95"/>
  <polygon points="300,160 330,160 320,240 280,240" fill="#f4f7fb" opacity="0.95"/>
  <polygon points="360,160 390,160 390,240 350,240" fill="#f4f7fb" opacity="0.95"/>
  <polygon points="420,160 450,160 460,240 420,240" fill="#10b981" opacity="0.9"/>

  <!-- Foreground Paint Roller & Stencil Graphic -->
  <g transform="translate(380, 210)">
    <rect x="0" y="0" width="70" height="18" rx="4" fill="#ff6b1a"/>
    <line x1="35" y1="18" x2="35" y2="70" stroke="#ffd66b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Banner badge -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="160" height="32" rx="4" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="80" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">42 CROSSINGS</text>
  </g>
</svg>