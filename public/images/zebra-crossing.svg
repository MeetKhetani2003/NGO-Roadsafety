<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="roadBase" x1="400" y1="0" x2="400" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1729"/>
      <stop offset="50%" stop-color="#070f1d"/>
      <stop offset="100%" stop-color="#050a13"/>
    </linearGradient>
    <linearGradient id="glowG" x1="400" y1="300" x2="400" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffc53d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Asphalt Surface (Bird's Eye / High Angle View) -->
  <rect width="800" height="1000" fill="url(#roadBase)"/>

  <!-- Road Grid Texture -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
  </g>

  <!-- Curbs with Hazard Yellow/Black Blocks -->
  <rect x="0" y="0" width="60" height="1000" fill="#14263f"/>
  <rect x="740" y="0" width="60" height="1000" fill="#14263f"/>
  <g fill="#ffc53d">
    <rect x="0" y="50" width="60" height="70"/>
    <rect x="0" y="190" width="60" height="70"/>
    <rect x="0" y="330" width="60" height="70"/>
    <rect x="0" y="470" width="60" height="70"/>
    <rect x="0" y="610" width="60" height="70"/>
    <rect x="0" y="750" width="60" height="70"/>
    <rect x="0" y="890" width="60" height="70"/>

    <rect x="740" y="50" width="60" height="70"/>
    <rect x="740" y="190" width="60" height="70"/>
    <rect x="740" y="330" width="60" height="70"/>
    <rect x="740" y="470" width="60" height="70"/>
    <rect x="740" y="610" width="60" height="70"/>
    <rect x="740" y="750" width="60" height="70"/>
    <rect x="740" y="890" width="60" height="70"/>
  </g>

  <!-- Big Bold White Zebra Crossing Bars -->
  <g fill="#f4f7fb" opacity="0.92">
    <rect x="100" y="120" width="600" height="50" rx="3"/>
    <rect x="100" y="220" width="600" height="50" rx="3"/>
    <rect x="100" y="320" width="600" height="50" rx="3"/>
    <rect x="100" y="420" width="600" height="50" rx="3"/>
    <rect x="100" y="520" width="600" height="50" rx="3"/>
    <rect x="100" y="620" width="600" height="50" rx="3"/>
    <rect x="100" y="720" width="600" height="50" rx="3"/>
    <rect x="100" y="820" width="600" height="50" rx="3"/>
  </g>

  <!-- Road Center Dashed Line -->
  <line x1="400" y1="0" x2="400" y2="100" stroke="#ffc53d" stroke-width="8" stroke-dasharray="30,20"/>
  <line x1="400" y1="900" x2="400" y2="1000" stroke="#ffc53d" stroke-width="8" stroke-dasharray="30,20"/>

  <!-- Pedestrian Footprints & Crossing Track Glow -->
  <rect x="250" y="80" width="300" height="840" fill="url(#glowG)"/>

  <!-- School Zone Marking On Pavement -->
  <g transform="translate(140, 20)">
    <rect x="0" y="0" width="160" height="40" rx="4" fill="#ff6b1a" opacity="0.8"/>
    <text x="80" y="26" font-family="'Anton', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">SLOW · 30</text>
  </g>
  <g transform="translate(500, 20)">
    <rect x="0" y="0" width="160" height="40" rx="4" fill="#10b981" opacity="0.8"/>
    <text x="80" y="26" font-family="'Anton', sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">LOOK · CROSS</text>
  </g>

  <!-- Pedestrians Passing Across Marked Crosswalk -->
  <!-- Pedestrian 1 (Parent & Child walking safely) -->
  <g transform="translate(260, 480)">
    <circle cx="40" cy="40" r="16" fill="#f4f7fb"/>
    <path d="M40 56V110L24 140M40 85L56 140" stroke="#f4f7fb" stroke-width="8" stroke-linecap="round"/>
    <line x1="40" y1="70" x2="80" y2="85" stroke="#f4f7fb" stroke-width="6" stroke-linecap="round"/>

    <!-- Child -->
    <circle cx="85" cy="70" r="11" fill="#ffd66b"/>
    <path d="M85 81V120L75 142M85 105L95 142" stroke="#ffd66b" stroke-width="6" stroke-linecap="round"/>
    <rect x="78" y="84" width="12" height="20" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Technical Audit Overlay HUD Elements -->
  <g transform="translate(100, 890)">
    <rect x="0" y="0" width="220" height="55" rx="3" fill="#070f1d" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">AUDIT REF #DEL-402</text>
    <text x="16" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f4f7fb" opacity="0.8">100% ZEBRA VISIBILITY</text>
  </g>
</svg>