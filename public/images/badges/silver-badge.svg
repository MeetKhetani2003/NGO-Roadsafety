<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Silver Merit Road Safety Badge -->
  <circle cx="50" cy="50" r="44" fill="#0f1e34" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="50" cy="50" r="38" fill="url(#silverGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  <defs>
    <radialGradient id="silverGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
  </defs>
  <!-- Medal Star in center -->
  <polygon points="50,26 55,38 68,39 58,49 61,62 50,55 39,62 42,49 32,39 45,38" fill="#1e293b"/>
  <circle cx="50" cy="46" r="6" fill="#ffffff"/>
  <text x="50" y="80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#f8fafc" text-anchor="middle">MERIT</text>
</svg>